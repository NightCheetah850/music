<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neumorphic Music Player</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>
    /* ========== Gaya Neumorphism (tidak berubah) ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 850px;
      background: #e0e0e0;
      border-radius: 50px;
      box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), opacity 0.3s ease;
      background: #e0e0e0;
      border-radius: 50px;
    }
    .screen.hidden {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }
    .screen.active {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }
    .neu-element { background: #e0e0e0; border-radius: 20px; box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff; }
    .neu-element-inset { background: #e0e0e0; border-radius: 20px; box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff; }
    .neu-button {
      background: #e0e0e0; border: none; border-radius: 50%; width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff;
      color: #555; font-size: 1.2rem; transition: all 0.2s ease;
    }
    .neu-button:active { box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff; transform: scale(0.95); }
    .search-header { margin-bottom: 25px; }
    .search-title { font-size: 2rem; font-weight: 700; color: #333; margin-bottom: 5px; }
    .search-subtitle { font-size: 0.9rem; color: #777; margin-bottom: 20px; }
    .search-input-wrapper { position: relative; margin-bottom: 20px; }
    .search-input {
      width: 100%; padding: 18px 25px; border: none; border-radius: 30px;
      background: #e0e0e0; box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
      font-size: 1rem; color: #333; outline: none; transition: 0.3s;
    }
    .search-input:focus { box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff; }
    .search-input::placeholder { color: #999; }
    .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #999; font-size: 1.2rem; }
    .results-list { flex: 1; overflow-y: auto; padding: 5px 0; display: flex; flex-direction: column; gap: 12px; }
    .song-item {
      display: flex; align-items: center; padding: 15px; border-radius: 20px;
      background: #e0e0e0; box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      animation: fadeInUp 0.4s ease forwards; opacity: 0; transform: translateY(20px);
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .song-img { width: 55px; height: 55px; border-radius: 15px; object-fit: cover; margin-right: 15px; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff; }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-weight: 600; color: #333; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 0.8rem; color: #777; }
    .song-actions { display: flex; gap: 8px; margin-left: 10px; }
    .action-btn {
      width: 40px; height: 40px; border-radius: 50%; background: #e0e0e0; border: none;
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff; color: #555; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
    }
    .action-btn:active { box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff; transform: scale(0.92); }
    .play-btn { color: #6c5ce7; }
    .queue-btn { color: #e17055; }
    .loading-spinner { display: flex; justify-content: center; padding: 30px; }
    .spinner {
      width: 50px; height: 50px; border-radius: 50%; background: #e0e0e0;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff; animation: spin 1s linear infinite;
      display: flex; align-items: center; justify-content: center; color: #6c5ce7; font-size: 1.3rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .empty-state { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; color: #999; text-align: center; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #bbb; }
    /* Player styles */
    .player-container { display: flex; flex-direction: column; height: 100%; }
    .player-header { display: flex; align-items: center; margin-bottom: 20px; }
    .back-btn { width: 45px; height: 45px; margin-right: 15px; }
    .now-playing-label { font-size: 0.8rem; color: #999; text-transform: uppercase; letter-spacing: 2px; }
    .album-art-container { display: flex; justify-content: center; margin: 20px 0 25px; }
    .album-art { width: 220px; height: 220px; border-radius: 30px; object-fit: cover; box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff; }
    .album-art.playing { animation: softPulse 3s ease-in-out infinite; }
    @keyframes softPulse { 0%,100% { box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff; } 50% { box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff; transform: scale(0.98); } }
    .song-details { text-align: center; margin-bottom: 15px; }
    .current-song-title { font-size: 1.3rem; font-weight: 700; color: #333; }
    .current-song-artist { font-size: 0.9rem; color: #777; }
    .lyrics-container {
      flex: 1; overflow-y: auto; margin: 15px 0; padding: 15px; border-radius: 20px;
      background: #e0e0e0; box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
      font-size: 0.85rem; color: #666; line-height: 1.6; text-align: center; max-height: 150px; min-height: 80px;
    }
    .lyrics-line.active { color: #6c5ce7; font-weight: 600; }
    .progress-container { display: flex; align-items: center; gap: 10px; margin: 10px 0 15px; font-size: 0.75rem; color: #888; }
    .progress-bar {
      flex: 1; height: 6px; border-radius: 3px; background: #e0e0e0;
      box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; cursor: pointer;
    }
    .progress-fill { height: 100%; border-radius: 3px; background: #6c5ce7; width: 0%; transition: width 0.1s linear; }
    .controls-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 10px 0 20px; }
    .control-btn { width: 55px; height: 55px; }
    .play-btn-large { width: 70px; height: 70px; background: #6c5ce7; color: white; font-size: 1.5rem; }
    .volume-container { display: flex; align-items: center; gap: 12px; margin-top: 5px; padding: 12px 20px; border-radius: 25px; background: #e0e0e0; box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff; }
    .volume-slider { flex: 1; -webkit-appearance: none; height: 8px; border-radius: 4px; background: #e0e0e0; box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #6c5ce7; box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff; }
    .queue-toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #333; color: white; padding: 12px 25px; border-radius: 30px; font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; gap: 8px;
    }
    .queue-toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Layar Pencarian -->
    <div class="screen active" id="searchScreen">
      <div class="search-header">
        <h1 class="search-title">Music</h1>
        <p class="search-subtitle">Discover and stream songs</p>
        <div class="search-input-wrapper neu-element-inset">
          <input type="text" class="search-input" id="searchInput" placeholder="Search song or artist..." autocomplete="off">
          <i class="fas fa-search search-icon"></i>
        </div>
      </div>
      <div class="results-list" id="resultsList">
        <div class="empty-state">
          <i class="fas fa-music"></i>
          <p>Search for a song to get started</p>
        </div>
      </div>
    </div>

    <!-- Layar Pemutar -->
    <div class="screen hidden" id="playerScreen">
      <div class="player-container">
        <div class="player-header">
          <button class="back-btn neu-button" id="playerBackBtn"><i class="fas fa-chevron-left"></i></button>
          <div class="now-playing-label">Now Playing</div>
        </div>
        <div class="album-art-container">
          <img class="album-art" id="albumArt" src="https://via.placeholder.com/220/333/fff?text=?" alt="Album Art">
        </div>
        <div class="song-details">
          <div class="current-song-title" id="currentTitle">Select a song</div>
          <div class="current-song-artist" id="currentArtist">Artist</div>
        </div>
        <div class="progress-container">
          <span id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
          <span id="durationTime">0:00</span>
        </div>
        <div class="lyrics-container" id="lyricsContainer"><span class="lyrics-line">Lyrics will appear here...</span></div>
        <div class="controls-row">
          <button class="control-btn neu-button" id="repeatBtn"><i class="fas fa-redo"></i></button>
          <button class="control-btn neu-button" id="backwardBtn"><i class="fas fa-backward"></i></button>
          <button class="control-btn play-btn-large neu-button" id="playPauseBtn"><i class="fas fa-play"></i></button>
          <button class="control-btn neu-button" id="skipBtn"><i class="fas fa-forward"></i></button>
          <button class="control-btn neu-button" id="shuffleBtn"><i class="fas fa-random"></i></button>
        </div>
        <div class="volume-container">
          <i class="fas fa-volume-up volume-icon" id="volumeIcon"></i>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
        </div>
      </div>
    </div>
  </div>
  <div class="queue-toast" id="queueToast"><i class="fas fa-check-circle"></i><span>Added to queue</span></div>

  <script>
    (function() {
      // ---------- DOM Elements ----------
      const searchScreen = document.getElementById('searchScreen');
      const playerScreen = document.getElementById('playerScreen');
      const searchInput = document.getElementById('searchInput');
      const resultsList = document.getElementById('resultsList');
      const playerBackBtn = document.getElementById('playerBackBtn');
      const albumArt = document.getElementById('albumArt');
      const currentTitle = document.getElementById('currentTitle');
      const currentArtist = document.getElementById('currentArtist');
      const lyricsContainer = document.getElementById('lyricsContainer');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const backwardBtn = document.getElementById('backwardBtn');
      const skipBtn = document.getElementById('skipBtn');
      const repeatBtn = document.getElementById('repeatBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      const currentTimeEl = document.getElementById('currentTime');
      const durationTimeEl = document.getElementById('durationTime');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeIcon = document.getElementById('volumeIcon');
      const queueToast = document.getElementById('queueToast');

      // ---------- State ----------
      let queue = [];
      let currentQueueIndex = -1;
      let isPlaying = false;
      let repeatMode = 'off';
      let shuffleMode = false;
      let audioElement = null;
      let hlsInstance = null;
      let searchTimeout = null;
      let currentSong = null;
      let lyricsData = null;
      let currentScreen = 'search'; // 'search' atau 'player'

      // ---------- API Endpoints ----------
      const SEARCH_API = 'https://musicapi.x007.workers.dev/search';
      const FETCH_API = 'https://musicapi.x007.workers.dev/fetch';
      const LYRICS_API = 'https://lrclib.net/api/search';

      // ---------- Helpers ----------
      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      }

      function showToast(message) {
        queueToast.querySelector('span').textContent = message;
        queueToast.classList.add('show');
        setTimeout(() => queueToast.classList.remove('show'), 2000);
      }

      // ---------- Navigasi Layar ----------
      function showScreen(screenName) {
        if (screenName === 'search') {
          searchScreen.classList.add('active');
          searchScreen.classList.remove('hidden');
          playerScreen.classList.add('hidden');
          playerScreen.classList.remove('active');
          currentScreen = 'search';
        } else {
          playerScreen.classList.add('active');
          playerScreen.classList.remove('hidden');
          searchScreen.classList.add('hidden');
          searchScreen.classList.remove('active');
          currentScreen = 'player';
        }
      }

      // ---------- Logika Tombol Kembali (Back Button Trap) ----------
      function handleBackButton() {
        // Selalu beralih antara search dan player, tidak pernah keluar dari aplikasi
        if (currentScreen === 'player') {
          showScreen('search');
          // Pastikan riwayat tetap sinkron: kita baru saja "mundur" ke search,
          // maka entri teratas sekarang adalah search. Tidak perlu push.
        } else {
          // Saat di search dan pengguna menekan kembali, kita ingin pindah ke player
          // dengan mendorong entri baru player agar loop tetap berjalan.
          showScreen('player');
          history.pushState({ screen: 'player' }, '', '#player');
        }
      }

      // Inisialisasi riwayat
      history.replaceState({ screen: 'search' }, '', '#search');

      window.addEventListener('popstate', (event) => {
        // Mencegah keluar dari aplikasi: jika state bukan milik kita, jangan izinkan.
        if (!event.state || (event.state.screen !== 'search' && event.state.screen !== 'player')) {
          // Pengguna mencoba keluar, kita alihkan ke layar lawan
          if (currentScreen === 'search') {
            showScreen('player');
            history.pushState({ screen: 'player' }, '', '#player');
          } else {
            showScreen('search');
            // Jika kita di player dan state tidak dikenal, kita paksa ke search
            history.replaceState({ screen: 'search' }, '', '#search');
          }
          return;
        }

        // State valid: pulihkan layar sesuai state
        if (event.state.screen === 'search') {
          showScreen('search');
        } else if (event.state.screen === 'player') {
          showScreen('player');
        }
      });

      // Tombol kembali di layar pemutar (UI button)
      playerBackBtn.addEventListener('click', () => {
        // Sama seperti handleBackButton tapi dari UI
        if (currentScreen === 'player') {
          showScreen('search');
          // Simulasikan popstate: hapus entri player dengan history.back()
          // Tapi lebih baik kita gunakan history.back() agar konsisten dengan tombol fisik
          history.back();
        }
      });

      // ---------- Audio Playback ----------
      function initAudio(url) {
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (audioElement) { audioElement.pause(); audioElement.src = ''; audioElement.load(); }
        audioElement = new Audio();
        audioElement.volume = volumeSlider.value / 100;
        audioElement.crossOrigin = 'anonymous';
        if (url && url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(audioElement);
          } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
            audioElement.src = url;
          }
        } else {
          audioElement.src = url;
        }
        audioElement.addEventListener('loadedmetadata', () => { durationTimeEl.textContent = formatTime(audioElement.duration); });
        audioElement.addEventListener('timeupdate', () => {
          const cur = audioElement.currentTime;
          const dur = audioElement.duration || 0;
          currentTimeEl.textContent = formatTime(cur);
          progressFill.style.width = dur ? (cur / dur) * 100 + '%' : '0%';
          updateActiveLyricLine(cur);
        });
        audioElement.addEventListener('ended', handleSongEnd);
        audioElement.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
        audioElement.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });
        return audioElement;
      }

      function playAudio() { if (audioElement) audioElement.play().catch(() => {}); }
      function pauseAudio() { if (audioElement) audioElement.pause(); }
      function togglePlay() { if (!audioElement) return; if (isPlaying) pauseAudio(); else playAudio(); }
      function updatePlayIcon() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
      }

      function handleSongEnd() {
        if (repeatMode === 'one') { audioElement.currentTime = 0; playAudio(); }
        else if (shuffleMode && queue.length) playSongFromQueue(Math.floor(Math.random() * queue.length));
        else if (currentQueueIndex < queue.length - 1) playSongFromQueue(currentQueueIndex + 1);
        else if (repeatMode === 'all') playSongFromQueue(0);
        else { isPlaying = false; updatePlayIcon(); }
      }

      function playSongFromQueue(index) {
        if (index < 0 || index >= queue.length) return;
        currentQueueIndex = index;
        loadAndPlaySong(queue[index]);
      }

      async function loadAndPlaySong(song) {
        currentSong = song;
        currentTitle.textContent = song.title || 'Unknown';
        currentArtist.textContent = song.artist || 'Unknown';
        albumArt.src = song.img || 'https://via.placeholder.com/220/333/fff?text=?';
        albumArt.classList.add('playing');
        lyricsContainer.innerHTML = '<span class="lyrics-line">Loading lyrics...</span>';
        try {
          const res = await fetch(`${FETCH_API}?id=${song.id}`);
          const data = await res.json();
          if (data.status !== 200 || !data.response) throw new Error('Stream not available');
          initAudio(data.response);
          playAudio();
          showScreen('player');
          history.pushState({ screen: 'player' }, '', '#player');
          fetchLyrics(song.title, song.artist);
        } catch (e) {
          console.error(e);
          lyricsContainer.innerHTML = '<span class="lyrics-line">Could not play song.</span>';
        }
      }

      // ---------- Lyrics ----------
      async function fetchLyrics(title, artist) {
        try {
          const res = await fetch(`${LYRICS_API}?q=${encodeURIComponent(title + ' ' + artist)}`);
          const data = await res.json();
          if (Array.isArray(data) && data.length) {
            lyricsData = data[0];
            displayLyrics(lyricsData);
          } else {
            lyricsContainer.innerHTML = '<span class="lyrics-line">No lyrics found</span>';
            lyricsData = null;
          }
        } catch { lyricsContainer.innerHTML = '<span class="lyrics-line">Lyrics unavailable</span>'; }
      }

      function displayLyrics(lyrics) {
        if (!lyrics?.syncedLyrics) { lyricsContainer.innerHTML = '<span class="lyrics-line">No synced lyrics</span>'; return; }
        const lines = lyrics.syncedLyrics.split('\n').filter(l => l.trim());
        lyricsContainer.innerHTML = lines.map(line => {
          const m = line.match(/\[(\d+):(\d+\.\d+)\]/);
          if (m) {
            const sec = parseInt(m[1]) * 60 + parseFloat(m[2]);
            const text = line.replace(/\[.*?\]/, '').trim();
            return `<div class="lyrics-line" data-time="${sec}">${text || '...'}</div>`;
          }
          return `<div class="lyrics-line">${line}</div>`;
        }).join('');
      }

      function updateActiveLyricLine(time) {
        if (!lyricsData?.syncedLyrics) return;
        const lines = lyricsContainer.querySelectorAll('.lyrics-line[data-time]');
        let active = -1;
        lines.forEach((el, i) => { if (parseFloat(el.dataset.time) <= time) active = i; el.classList.remove('active'); });
        if (active >= 0) { lines[active].classList.add('active'); lines[active].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      }

      // ---------- Search ----------
      async function performSearch(query) {
        if (!query.trim()) {
          resultsList.innerHTML = '<div class="empty-state"><i class="fas fa-music"></i><p>Search for a song</p></div>';
          return;
        }
        resultsList.innerHTML = '<div class="loading-spinner"><div class="spinner"><i class="fas fa-spinner"></i></div></div>';
        try {
          const res = await fetch(`${SEARCH_API}?q=${encodeURIComponent(query)}&searchEngine=gaama`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data.status === 200 && Array.isArray(data.response)) renderResults(data.response);
          else resultsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No results found</p></div>';
        } catch (err) {
          console.error('Search error:', err);
          resultsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Something went wrong. Make sure you run this page via a local server.</p></div>';
        }
      }

      function renderResults(songs) {
        resultsList.innerHTML = songs.map((song, i) => {
          const title = song.title || 'Unknown';
          let artist = 'Unknown Artist';
          if (title.includes('-')) artist = title.split('-')[0].trim();
          const songStr = JSON.stringify({...song, artist}).replace(/'/g, "&#39;");
          return `
            <div class="song-item" style="animation-delay:${i*0.05}s">
              <img class="song-img" src="${song.img || 'https://via.placeholder.com/55'}" onerror="this.src='https://via.placeholder.com/55'">
              <div class="song-info">
                <div class="song-title">${title}</div>
                <div class="song-artist">${artist}</div>
              </div>
              <div class="song-actions">
                <button class="action-btn queue-btn" data-action="queue" data-song='${songStr}'><i class="fas fa-plus"></i></button>
                <button class="action-btn play-btn" data-action="play" data-song='${songStr}'><i class="fas fa-play"></i></button>
              </div>
            </div>`;
        }).join('');
        document.querySelectorAll('.action-btn[data-action="play"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePlayNow(JSON.parse(btn.dataset.song));
          });
        });
        document.querySelectorAll('.action-btn[data-action="queue"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleAddToQueue(JSON.parse(btn.dataset.song));
          });
        });
      }

      function handlePlayNow(song) {
        const exists = queue.findIndex(s => s.id === song.id);
        if (exists === -1) { queue.push(song); currentQueueIndex = queue.length - 1; }
        else currentQueueIndex = exists;
        loadAndPlaySong(song);
      }

      function handleAddToQueue(song) {
        if (!queue.some(s => s.id === song.id)) {
          queue.push(song);
          showToast('Added to queue');
        } else showToast('Already in queue');
      }

      // ---------- Player Controls ----------
      function skipForward() {
        if (!queue.length) return;
        if (shuffleMode) playSongFromQueue(Math.floor(Math.random() * queue.length));
        else if (currentQueueIndex < queue.length - 1) playSongFromQueue(currentQueueIndex + 1);
        else if (repeatMode === 'all') playSongFromQueue(0);
      }
      function restartSong() { if (audioElement) { audioElement.currentTime = 0; if (!isPlaying) playAudio(); } }
      function toggleRepeat() {
        const modes = ['off', 'one', 'all'];
        const idx = modes.indexOf(repeatMode);
        repeatMode = modes[(idx + 1) % 3];
        repeatBtn.style.color = repeatMode === 'off' ? '#555' : '#6c5ce7';
        repeatBtn.innerHTML = repeatMode === 'one' ? '<i class="fas fa-redo"></i><span style="font-size:0.6rem;position:absolute;">1</span>' : '<i class="fas fa-redo"></i>';
      }
      function toggleShuffle() {
        shuffleMode = !shuffleMode;
        shuffleBtn.style.color = shuffleMode ? '#6c5ce7' : '#555';
      }
      volumeSlider.addEventListener('input', e => {
        if (audioElement) audioElement.volume = e.target.value / 100;
        const vol = e.target.value / 100;
        volumeIcon.className = vol === 0 ? 'fas fa-volume-mute' : vol < 0.5 ? 'fas fa-volume-down' : 'fas fa-volume-up';
      });
      progressBar.addEventListener('click', e => {
        if (!audioElement?.duration) return;
        const rect = progressBar.getBoundingClientRect();
        audioElement.currentTime = ((e.clientX - rect.left) / rect.width) * audioElement.duration;
      });

      // Event listeners
      searchInput.addEventListener('input', e => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(e.target.value), 400);
      });
      playPauseBtn.addEventListener('click', togglePlay);
      backwardBtn.addEventListener('click', restartSong);
      skipBtn.addEventListener('click', skipForward);
      repeatBtn.addEventListener('click', toggleRepeat);
      shuffleBtn.addEventListener('click', toggleShuffle);

      // Set default volume icon
      volumeSlider.dispatchEvent(new Event('input'));
    })();
  </script>
</body>
</html>
