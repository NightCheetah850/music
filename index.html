<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Music Player</title>
  <!-- Font Awesome 6 for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- hls.js for HLS streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.3s ease;
    }

    /* main app container */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 850px;
      background: #e0e0e0;
      border-radius: 50px;
      box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;
    }

    /* screen management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), opacity 0.3s ease;
      will-change: transform, opacity;
      background: #e0e0e0;
      border-radius: 50px;
    }

    .screen.hidden {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    .screen.active {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* neumorphic elements */
    .neu-element {
      background: #e0e0e0;
      border-radius: 20px;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      transition: all 0.25s ease;
    }

    .neu-element-inset {
      background: #e0e0e0;
      border-radius: 20px;
      box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff;
    }

    .neu-button {
      background: #e0e0e0;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff;
      transition: all 0.2s ease;
      color: #555;
      font-size: 1.2rem;
    }

    .neu-button:active {
      box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
      transform: scale(0.95);
    }

    .neu-button.primary {
      background: #e0e0e0;
      color: #6c5ce7;
      font-size: 1.5rem;
    }

    /* search screen */
    .search-header {
      margin-bottom: 25px;
    }

    .search-title {
      font-size: 2rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    .search-subtitle {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 20px;
    }

    .search-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 18px 25px;
      border: none;
      border-radius: 30px;
      background: #e0e0e0;
      box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
      font-size: 1rem;
      color: #333;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff;
    }

    .search-input::placeholder {
      color: #999;
    }

    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 1.2rem;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .search-input:focus ~ .search-icon {
      color: #6c5ce7;
      transform: translateY(-50%) scale(1.1);
    }

    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song-item {
      display: flex;
      align-items: center;
      padding: 15px;
      border-radius: 20px;
      background: #e0e0e0;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      transition: all 0.25s ease;
      cursor: pointer;
      animation: fadeInUp 0.4s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .song-item:hover {
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
    }

    .song-item:active {
      box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .song-img {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      object-fit: cover;
      margin-right: 15px;
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 0.8rem;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-actions {
      display: flex;
      gap: 8px;
      margin-left: 10px;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e0e0e0;
      border: none;
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .action-btn:active {
      box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff;
      transform: scale(0.92);
    }

    .action-btn.play-btn {
      background: #e0e0e0;
      color: #6c5ce7;
      font-size: 1rem;
    }

    .action-btn.queue-btn {
      color: #e17055;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #e0e0e0;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      animation: spin 1s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c5ce7;
      font-size: 1.3rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #999;
      text-align: center;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #bbb;
    }

    /* player screen */
    .player-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .player-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e0e0e0;
      border: none;
      box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff;
      color: #555;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      transition: all 0.2s ease;
    }

    .back-btn:active {
      box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
    }

    .now-playing-label {
      font-size: 0.8rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .album-art-container {
      display: flex;
      justify-content: center;
      margin: 20px 0 25px;
    }

    .album-art {
      width: 220px;
      height: 220px;
      border-radius: 30px;
      object-fit: cover;
      box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff;
      transition: all 0.3s ease;
    }

    .album-art.playing {
      animation: softPulse 3s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff; }
      50% { box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff; transform: scale(0.98); }
    }

    .song-details {
      text-align: center;
      margin-bottom: 15px;
    }

    .current-song-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 5px;
    }

    .current-song-artist {
      font-size: 0.9rem;
      color: #777;
    }

    /* lyrics */
    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
      padding: 15px;
      border-radius: 20px;
      background: #e0e0e0;
      box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.6;
      text-align: center;
      max-height: 150px;
      min-height: 80px;
    }

    .lyrics-line {
      transition: color 0.3s ease, font-weight 0.3s ease;
    }

    .lyrics-line.active {
      color: #6c5ce7;
      font-weight: 600;
    }

    /* progress bar */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 15px;
      font-size: 0.75rem;
      color: #888;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #e0e0e0;
      box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: #6c5ce7;
      width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 6px rgba(108, 92, 231, 0.5);
    }

    /* controls */
    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 10px 0 20px;
    }

    .control-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #e0e0e0;
      border: none;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      color: #555;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-btn:active {
      box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff;
      transform: scale(0.93);
    }

    .play-btn-large {
      width: 70px;
      height: 70px;
      background: #6c5ce7;
      color: white;
      box-shadow: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      font-size: 1.5rem;
    }

    .play-btn-large:active {
      box-shadow: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff;
    }

    /* volume control */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 5px;
      padding: 12px 20px;
      border-radius: 25px;
      background: #e0e0e0;
      box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff;
    }

    .volume-icon {
      color: #888;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      background: #e0e0e0;
      box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #6c5ce7;
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .volume-slider::-webkit-slider-thumb:active {
      box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff;
      transform: scale(0.9);
    }

    /* queue toast */
    .queue-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .queue-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* responsive */
    @media (max-width: 400px) {
      .app-container {
        height: 95vh;
        border-radius: 35px;
      }
      .album-art {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Search Screen -->
    <div class="screen active" id="searchScreen">
      <div class="search-header">
        <h1 class="search-title">Music</h1>
        <p class="search-subtitle">Discover and stream your favorite songs</p>
        <div class="search-input-wrapper neu-element-inset">
          <input type="text" class="search-input" id="searchInput" placeholder="Search song or artist..." autocomplete="off">
          <i class="fas fa-search search-icon"></i>
        </div>
      </div>
      <div class="results-list" id="resultsList">
        <div class="empty-state">
          <i class="fas fa-music"></i>
          <p>Search for a song to get started</p>
        </div>
      </div>
    </div>

    <!-- Player Screen -->
    <div class="screen hidden" id="playerScreen">
      <div class="player-container">
        <div class="player-header">
          <button class="back-btn" id="playerBackBtn" aria-label="Back to search">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div>
            <div class="now-playing-label">Now Playing</div>
          </div>
        </div>

        <div class="album-art-container">
          <img class="album-art" id="albumArt" src="https://via.placeholder.com/220/333/fff?text=?" alt="Album Art">
        </div>

        <div class="song-details">
          <div class="current-song-title" id="currentTitle">Select a song</div>
          <div class="current-song-artist" id="currentArtist">Artist</div>
        </div>

        <div class="progress-container">
          <span id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="durationTime">0:00</span>
        </div>

        <div class="lyrics-container" id="lyricsContainer">
          <span class="lyrics-line">Lyrics will appear here...</span>
        </div>

        <div class="controls-row">
          <button class="control-btn" id="repeatBtn" aria-label="Repeat">
            <i class="fas fa-redo"></i>
          </button>
          <button class="control-btn" id="backwardBtn" aria-label="Restart">
            <i class="fas fa-backward"></i>
          </button>
          <button class="control-btn play-btn-large" id="playPauseBtn" aria-label="Play/Pause">
            <i class="fas fa-play"></i>
          </button>
          <button class="control-btn" id="skipBtn" aria-label="Skip">
            <i class="fas fa-forward"></i>
          </button>
          <button class="control-btn" id="shuffleBtn" aria-label="Shuffle">
            <i class="fas fa-random"></i>
          </button>
        </div>

        <div class="volume-container">
          <i class="fas fa-volume-up volume-icon" id="volumeIcon"></i>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
        </div>
      </div>
    </div>
  </div>

  <!-- Toast for queue addition -->
  <div class="queue-toast" id="queueToast">
    <i class="fas fa-check-circle"></i>
    <span>Added to queue</span>
  </div>

  <script>
    (function() {
      // ---------- DOM Elements ----------
      const searchScreen = document.getElementById('searchScreen');
      const playerScreen = document.getElementById('playerScreen');
      const searchInput = document.getElementById('searchInput');
      const resultsList = document.getElementById('resultsList');
      const playerBackBtn = document.getElementById('playerBackBtn');
      const albumArt = document.getElementById('albumArt');
      const currentTitle = document.getElementById('currentTitle');
      const currentArtist = document.getElementById('currentArtist');
      const lyricsContainer = document.getElementById('lyricsContainer');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const backwardBtn = document.getElementById('backwardBtn');
      const skipBtn = document.getElementById('skipBtn');
      const repeatBtn = document.getElementById('repeatBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      const currentTimeEl = document.getElementById('currentTime');
      const durationTimeEl = document.getElementById('durationTime');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeIcon = document.getElementById('volumeIcon');
      const queueToast = document.getElementById('queueToast');

      // ---------- State ----------
      let queue = [];
      let currentQueueIndex = -1;
      let isPlaying = false;
      let repeatMode = 'off'; // off, one, all
      let shuffleMode = false;
      let audioElement = null;
      let hlsInstance = null;
      let searchTimeout = null;
      let currentSong = null;
      let lyricsData = null;

      // ---------- API Endpoints ----------
      const SEARCH_API = 'https://musicapi.x007.workers.dev/search';
      const FETCH_API = 'https://musicapi.x007.workers.dev/fetch';
      const LYRICS_API = 'https://lrclib.net/api/search';

      // ---------- Helper Functions ----------
      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      }

      function showToast(message) {
        queueToast.querySelector('span').textContent = message;
        queueToast.classList.add('show');
        setTimeout(() => queueToast.classList.remove('show'), 2000);
      }

      function showSearchScreen() {
        searchScreen.classList.add('active');
        searchScreen.classList.remove('hidden');
        playerScreen.classList.add('hidden');
        playerScreen.classList.remove('active');
        // Push state for back button handling
        history.pushState({ screen: 'search' }, '', '#search');
      }

      function showPlayerScreen() {
        playerScreen.classList.add('active');
        playerScreen.classList.remove('hidden');
        searchScreen.classList.add('hidden');
        searchScreen.classList.remove('active');
        history.pushState({ screen: 'player' }, '', '#player');
      }

      // ---------- Audio Playback ----------
      function initAudio(url) {
        // Destroy previous instances
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }
        if (audioElement) {
          audioElement.pause();
          audioElement.removeAttribute('src');
          audioElement.load();
        }

        // Create new audio element
        audioElement = new Audio();
        audioElement.volume = volumeSlider.value / 100;
        audioElement.crossOrigin = 'anonymous';

        // Check if HLS stream
        if (url && url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(audioElement);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              // Ready to play
            });
          } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
            audioElement.src = url;
          }
        } else {
          audioElement.src = url;
        }

        // Event listeners
        audioElement.addEventListener('loadedmetadata', () => {
          durationTimeEl.textContent = formatTime(audioElement.duration);
        });

        audioElement.addEventListener('timeupdate', () => {
          const current = audioElement.currentTime;
          const duration = audioElement.duration || 0;
          currentTimeEl.textContent = formatTime(current);
          const percent = duration ? (current / duration) * 100 : 0;
          progressFill.style.width = `${percent}%`;
          updateActiveLyricLine(current);
        });

        audioElement.addEventListener('ended', () => {
          handleSongEnd();
        });

        audioElement.addEventListener('play', () => {
          isPlaying = true;
          updatePlayPauseIcon();
        });

        audioElement.addEventListener('pause', () => {
          isPlaying = false;
          updatePlayPauseIcon();
        });

        audioElement.addEventListener('error', (e) => {
          console.error('Audio error:', e);
          isPlaying = false;
          updatePlayPauseIcon();
        });

        return audioElement;
      }

      function playAudio() {
        if (!audioElement) return;
        const playPromise = audioElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.warn('Playback interrupted:', error);
            isPlaying = false;
            updatePlayPauseIcon();
          });
        }
      }

      function pauseAudio() {
        if (!audioElement) return;
        audioElement.pause();
      }

      function togglePlayPause() {
        if (!audioElement) return;
        if (isPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      }

      function updatePlayPauseIcon() {
        const icon = playPauseBtn.querySelector('i');
        if (isPlaying) {
          icon.className = 'fas fa-pause';
        } else {
          icon.className = 'fas fa-play';
        }
      }

      function handleSongEnd() {
        if (repeatMode === 'one') {
          if (audioElement) {
            audioElement.currentTime = 0;
            playAudio();
          }
        } else if (shuffleMode && queue.length > 0) {
          const randomIndex = Math.floor(Math.random() * queue.length);
          playSongFromQueue(randomIndex);
        } else if (currentQueueIndex < queue.length - 1) {
          playSongFromQueue(currentQueueIndex + 1);
        } else if (repeatMode === 'all') {
          playSongFromQueue(0);
        } else {
          isPlaying = false;
          updatePlayPauseIcon();
        }
      }

      function playSongFromQueue(index) {
        if (index < 0 || index >= queue.length) return;
        currentQueueIndex = index;
        const song = queue[index];
        loadAndPlaySong(song);
      }

      async function loadAndPlaySong(song) {
        currentSong = song;
        currentTitle.textContent = song.title || 'Unknown Title';
        currentArtist.textContent = song.artist || 'Unknown Artist';
        albumArt.src = song.img || 'https://via.placeholder.com/220/333/fff?text=?';
        albumArt.classList.add('playing');
        lyricsContainer.innerHTML = '<span class="lyrics-line">Loading lyrics...</span>';

        try {
          // Fetch stream URL
          const fetchResponse = await fetch(`${FETCH_API}?id=${song.id}`);
          const fetchData = await fetchResponse.json();
          if (fetchData.status !== 200 || !fetchData.response) {
            throw new Error('Failed to fetch stream');
          }
          const streamUrl = fetchData.response;
          initAudio(streamUrl);
          playAudio();
          showPlayerScreen();
          fetchLyrics(song.title, song.artist);
        } catch (error) {
          console.error('Error loading song:', error);
          lyricsContainer.innerHTML = '<span class="lyrics-line">Could not load song. Please try again.</span>';
        }
      }

      // ---------- Lyrics ----------
      async function fetchLyrics(title, artist) {
        try {
          const query = `${title} ${artist}`;
          const response = await fetch(`${LYRICS_API}?q=${encodeURIComponent(query)}`);
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            lyricsData = data[0];
            displayLyrics(lyricsData);
          } else {
            lyricsContainer.innerHTML = '<span class="lyrics-line">No lyrics found</span>';
            lyricsData = null;
          }
        } catch (error) {
          console.error('Lyrics fetch error:', error);
          lyricsContainer.innerHTML = '<span class="lyrics-line">Lyrics unavailable</span>';
          lyricsData = null;
        }
      }

      function displayLyrics(lyrics) {
        if (!lyrics || !lyrics.syncedLyrics) {
          lyricsContainer.innerHTML = '<span class="lyrics-line">No synced lyrics available</span>';
          return;
        }
        const lines = lyrics.syncedLyrics.split('\n').filter(line => line.trim() !== '');
        const html = lines.map(line => {
          const timeMatch = line.match(/\[(\d+):(\d+\.\d+)\]/);
          if (timeMatch) {
            const minutes = parseInt(timeMatch[1]);
            const seconds = parseFloat(timeMatch[2]);
            const timeInSeconds = minutes * 60 + seconds;
            const text = line.replace(/\[.*?\]/, '').trim();
            return `<div class="lyrics-line" data-time="${timeInSeconds}">${text || '...'}</div>`;
          }
          return `<div class="lyrics-line">${line}</div>`;
        }).join('');
        lyricsContainer.innerHTML = html;
      }

      function updateActiveLyricLine(currentTime) {
        if (!lyricsData || !lyricsData.syncedLyrics) return;
        const lines = lyricsContainer.querySelectorAll('.lyrics-line[data-time]');
        let activeIndex = -1;
        lines.forEach((line, index) => {
          const lineTime = parseFloat(line.getAttribute('data-time'));
          if (lineTime <= currentTime) {
            activeIndex = index;
          }
          line.classList.remove('active');
        });
        if (activeIndex >= 0) {
          lines[activeIndex].classList.add('active');
          lines[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // ---------- Search ----------
      async function performSearch(query) {
        if (!query.trim()) {
          resultsList.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-music"></i>
              <p>Search for a song to get started</p>
            </div>`;
          return;
        }

        resultsList.innerHTML = `
          <div class="loading-spinner">
            <div class="spinner"><i class="fas fa-spinner"></i></div>
          </div>`;

        try {
          const response = await fetch(`${SEARCH_API}?q=${encodeURIComponent(query)}&searchEngine=gaama`);
          const data = await response.json();
          if (data.status === 200 && Array.isArray(data.response)) {
            renderSearchResults(data.response);
          } else {
            resultsList.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-search"></i>
                <p>No results found for "${query}"</p>
              </div>`;
          }
        } catch (error) {
          console.error('Search error:', error);
          resultsList.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-circle"></i>
              <p>Something went wrong. Please try again.</p>
            </div>`;
        }
      }

      function renderSearchResults(songs) {
        if (songs.length === 0) {
          resultsList.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-search"></i>
              <p>No results found</p>
            </div>`;
          return;
        }

        resultsList.innerHTML = songs.map((song, index) => {
          const title = song.title || 'Unknown Title';
          // Extract artist from title if possible
          let artist = 'Unknown Artist';
          if (title.includes('-')) {
            const parts = title.split('-');
            artist = parts[0].trim();
          }
          return `
            <div class="song-item" style="animation-delay: ${index * 0.05}s" data-song='${JSON.stringify({...song, artist}).replace(/'/g, "&#39;")}'>
              <img class="song-img" src="${song.img || 'https://via.placeholder.com/55/333/fff?text=?'}" alt="${title}" onerror="this.src='https://via.placeholder.com/55/333/fff?text=!'">
              <div class="song-info">
                <div class="song-title">${title}</div>
                <div class="song-artist">${artist}</div>
              </div>
              <div class="song-actions">
                <button class="action-btn queue-btn" data-action="queue" data-song='${JSON.stringify({...song, artist}).replace(/'/g, "&#39;")}' aria-label="Add to queue">
                  <i class="fas fa-plus"></i>
                </button>
                <button class="action-btn play-btn" data-action="play" data-song='${JSON.stringify({...song, artist}).replace(/'/g, "&#39;")}' aria-label="Play now">
                  <i class="fas fa-play"></i>
                </button>
              </div>
            </div>`;
        }).join('');

        // Add event listeners
        document.querySelectorAll('.action-btn[data-action="play"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const songData = JSON.parse(btn.getAttribute('data-song'));
            handlePlayNow(songData);
          });
        });

        document.querySelectorAll('.action-btn[data-action="queue"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const songData = JSON.parse(btn.getAttribute('data-song'));
            handleAddToQueue(songData);
          });
        });
      }

      function handlePlayNow(song) {
        // Add to queue if not already present
        const exists = queue.findIndex(item => item.id === song.id);
        if (exists === -1) {
          queue.push(song);
          currentQueueIndex = queue.length - 1;
        } else {
          currentQueueIndex = exists;
        }
        loadAndPlaySong(song);
      }

      function handleAddToQueue(song) {
        const exists = queue.findIndex(item => item.id === song.id);
        if (exists === -1) {
          queue.push(song);
          // Animate the toast
          showToast('Added to queue');
          // Animate the button
          const btn = document.querySelector(`.action-btn[data-song='${JSON.stringify(song).replace(/'/g, "&#39;")}']`);
          if (btn) {
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => { btn.style.transform = ''; }, 200);
          }
        } else {
          showToast('Already in queue');
        }
      }

      // ---------- Player Controls ----------
      function skipForward() {
        if (queue.length === 0) return;
        if (shuffleMode) {
          const randomIndex = Math.floor(Math.random() * queue.length);
          playSongFromQueue(randomIndex);
        } else if (currentQueueIndex < queue.length - 1) {
          playSongFromQueue(currentQueueIndex + 1);
        } else if (repeatMode === 'all') {
          playSongFromQueue(0);
        }
      }

      function skipBackward() {
        if (queue.length === 0 || !audioElement) return;
        if (audioElement.currentTime > 3) {
          audioElement.currentTime = 0;
        } else if (currentQueueIndex > 0) {
          playSongFromQueue(currentQueueIndex - 1);
        } else {
          audioElement.currentTime = 0;
        }
      }

      function restartSong() {
        if (audioElement) {
          audioElement.currentTime = 0;
          if (!isPlaying) playAudio();
        }
      }

      function toggleRepeat() {
        const modes = ['off', 'one', 'all'];
        const currentIndex = modes.indexOf(repeatMode);
        repeatMode = modes[(currentIndex + 1) % modes.length];
        const icon = repeatBtn.querySelector('i');
        if (repeatMode === 'off') {
          icon.className = 'fas fa-redo';
          repeatBtn.style.color = '#555';
        } else if (repeatMode === 'one') {
          icon.className = 'fas fa-redo';
          repeatBtn.style.color = '#6c5ce7';
          repeatBtn.innerHTML = '<i class="fas fa-redo"></i><span style="font-size:0.6rem;position:absolute;">1</span>';
        } else {
          icon.className = 'fas fa-redo';
          repeatBtn.style.color = '#6c5ce7';
          repeatBtn.innerHTML = '<i class="fas fa-redo"></i>';
        }
      }

      function toggleShuffle() {
        shuffleMode = !shuffleMode;
        shuffleBtn.style.color = shuffleMode ? '#6c5ce7' : '#555';
      }

      // ---------- Volume ----------
      volumeSlider.addEventListener('input', (e) => {
        const volume = e.target.value / 100;
        if (audioElement) {
          audioElement.volume = volume;
        }
        updateVolumeIcon(volume);
      });

      function updateVolumeIcon(volume) {
        if (volume === 0) {
          volumeIcon.className = 'fas fa-volume-mute';
        } else if (volume < 0.5) {
          volumeIcon.className = 'fas fa-volume-down';
        } else {
          volumeIcon.className = 'fas fa-volume-up';
        }
      }

      // ---------- Progress Bar ----------
      progressBar.addEventListener('click', (e) => {
        if (!audioElement) return;
        const rect = progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const duration = audioElement.duration;
        if (duration) {
          audioElement.currentTime = (clickX / width) * duration;
        }
      });

      // ---------- Navigation (Back Button) ----------
      function goToSearch() {
        if (isPlaying) {
          pauseAudio();
        }
        showSearchScreen();
      }

      function goToPlayer() {
        if (currentSong) {
          showPlayerScreen();
        } else if (queue.length > 0) {
          playSongFromQueue(0);
        }
      }

      // Handle browser back button
      window.addEventListener('popstate', (event) => {
        if (event.state) {
          if (event.state.screen === 'search') {
            showSearchScreen();
          } else if (event.state.screen === 'player') {
            showPlayerScreen();
          }
        } else {
          // No state, default to search
          showSearchScreen();
        }
      });

      // Player back button
      playerBackBtn.addEventListener('click', goToSearch);

      // ---------- Event Listeners ----------
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          performSearch(e.target.value);
        }, 400);
      });

      playPauseBtn.addEventListener('click', togglePlayPause);
      backwardBtn.addEventListener('click', restartSong);
      skipBtn.addEventListener('click', skipForward);
      repeatBtn.addEventListener('click', toggleRepeat);
      shuffleBtn.addEventListener('click', toggleShuffle);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        switch(e.key) {
          case ' ':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'ArrowRight':
            skipForward();
            break;
          case 'ArrowLeft':
            skipBackward();
            break;
        }
      });

      // Initialize history state
      if (!history.state) {
        history.replaceState({ screen: 'search' }, '', '#search');
      }

      // Set initial volume
      updateVolumeIcon(volumeSlider.value / 100);

      console.log('Neumorphic Music Player ready!');
    })();
  </script>
</body>
</html>
